[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subliminal-recon"
version = "2.0.0"
description = "Passive & active subdomain reconnaissance — silent, precise, extensible"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Maquli" }]
requires-python = ">=3.10"
keywords = ["subdomain", "recon", "osint", "bug-bounty", "security", "enumeration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
gui  = []                         # Tkinter ships with CPython; no extra dep needed
yaml = ["pyyaml>=6.0"]
dev  = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
]

[project.scripts]
subliminal = "subliminal.cli.main:main"

[project.urls]
Homepage   = "https://github.com/Maquli/subliminal"
Repository = "https://github.com/Maquli/subliminal"
Issues     = "https://github.com/Maquli/subliminal/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["subliminal*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["subliminal/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
